<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Attendance System</title>

<style>
/* RESET */
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
}

/* ---------------- BACKGROUND EFFECTS ---------------- */
body{
    overflow-x: hidden;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
    background: radial-gradient(circle at top left, #4b21e6, #1a003b);
    animation: bgMove 10s infinite alternate ease-in-out;
}

@keyframes bgMove {
    0% { background: radial-gradient(circle at top left, #4b21e6, #1a003b); }
    50% { background: radial-gradient(circle at bottom right, #6a00ff, #090026); }
    100% { background: radial-gradient(circle at center, #5500d4, #0e0030); }
}

/* Floating glass circles */
.circle{
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(15px);
    animation: float 6s infinite ease-in-out;
    filter: blur(1px);
}
.circle:nth-child(1){ width: 200px; height: 200px; top: 10%; left: 5%; }
.circle:nth-child(2){ width: 300px; height: 300px; bottom: 10%; right: 10%; animation-delay: 3s; }

@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-25px); }
    100% { transform: translateY(0px); }
}

/* ---------------- LOGIN PAGE ---------------- */
.login-box{
    width: 380px;
    padding: 30px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(20px);
    border-radius: 25px;
    border: 1px solid rgba(255,255,255,0.25);
    text-align: center;
    animation: fadeUp .8s ease forwards;
    box-shadow: 0 0 35px rgba(0,0,0,0.3);
}

.login-box h2{
    font-size: 30px;
    margin-bottom: 20px;
    font-weight: 600;
    text-shadow: 0 0 10px #b084ff;
}

/* Inputs */
.input{
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    border: none;
    border-radius: 12px;
    outline: none;
    font-size: 16px;
    background: rgba(255,255,255,0.2);
    color: #fff;
}

.input::placeholder { color: #eee; }

/* Login Button */
.btn{
    width: 100%;
    padding: 12px;
    margin-top: 20px;
    background: linear-gradient(135deg, #a200ff, #ff0084);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.3s;
}
.btn:hover{
    transform: scale(1.07);
    box-shadow: 0 0 20px #e100ff;
}

/* ---------------- DASHBOARD ---------------- */
.dashboard{
    width: 90%;
    max-width: 1200px;
    display: none;
    animation: fadeUp .8s ease forwards;
}

/* NAVBAR */
.navbar{
    display: flex;
    justify-content: space-between;
    padding: 20px;
    background: rgba(255,255,255,0.12);
    border-radius: 18px;
    backdrop-filter: blur(20px);
    margin-bottom: 25px;
    border: 1px solid rgba(255,255,255,0.25);
    box-shadow: 0 0 20px rgba(0,0,0,0.25);
}
.navbar h2{
    font-size: 26px;
    text-shadow: 0 0 10px #ff7bee;
}

.logout-btn{
    padding: 8px 15px;
    background: #ff4b4b;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
    transition: 0.3s;
}
.logout-btn:hover{
    background: #ff6e6e;
    transform: scale(1.1);
}

/* CARDS */
.cards{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 25px;
}

.card{
    background: rgba(255,255,255,0.15);
    padding: 22px;
    border-radius: 22px;
    border: 1px solid rgba(255,255,255,0.25);
    backdrop-filter: blur(20px);
    transition: .4s;
    box-shadow: 0 0 25px rgba(0,0,0,0.25);
}
.card:hover{
    transform: translateY(-10px);
    box-shadow: 0 0 25px #d300ff;
}

/* TABLE */
.table-box{
    margin-top: 30px;
    padding: 20px;
    background: rgba(255,255,255,0.15);
    border-radius: 20px;
    backdrop-filter: blur(20px);
    box-shadow: 0 0 30px rgba(0,0,0,0.25);
}

table{
    width: 100%;
    border-collapse: collapse;
    color: #fff;
}
th, td{
    padding: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.2);
}
th{
    background: rgba(255,255,255,0.2);
    border-radius: 8px;
    text-shadow: 0 0 6px #d993ff;
}

/* Mark Button */
.mark-btn{
    padding: 8px 14px;
    background: #2dfd2d;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
}
.mark-btn:hover{
    transform: scale(1.1);
    box-shadow: 0 0 10px #00ff00;
}

/* Animation */
@keyframes fadeUp{
    0%{ opacity: 0; transform: translateY(20px); }
    100%{ opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<!-- Floating Background Objects -->
<div class="circle"></div>
<div class="circle"></div>

<!-- LOGIN PAGE -->
<div class="login-box" id="loginPage">
    <h2>Teacher Login</h2>
    <input type="text" id="username" class="input" placeholder="Enter Username">
    <input type="password" id="password" class="input" placeholder="Enter Password">
    <button class="btn" onclick="login()">LOGIN</button>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">

    <div class="navbar">
        <h2>📊 Teacher Dashboard</h2>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="cards">
        <div class="card"><h3>Total Students</h3><p id="total">10</p></div>
        <div class="card"><h3>Present Today</h3><p id="present">0</p></div>
        <div class="card"><h3>Absent Today</h3><p id="absent">0</p></div>
        <div class="card"><h3>Attendance %</h3><p id="percent">0%</p></div>
    </div>

    <div class="table-box">
        <h2 style="margin-bottom: 15px;">Students List</h2>
        <table>
            <thead>
                <tr>
                    <th>Roll</th>
                    <th>Name</th>
                    <th>Status</th>
                    <th>Mark</th>
                </tr>
            </thead>
            <tbody id="studentTable"></tbody>
        </table>
    </div>

</div>

<script>
/* LOGIN */
function login(){
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if(user === "teacher" && pass === "12345"){
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
    } else {
        alert("Incorrect Username or Password ❌");
    }
}

/* LOGOUT */
function logout(){
    location.reload();
}

/* STUDENTS */
const students = [
    "Shubham Chaudhari","Saad Bagwan","Anwesh Pawar","Om Dhande","Parth Ambawale",
    "Abhiskeh Andhale","Om Mane","Gaurav Deshpande","Dinesh Chavan","Tanay Gaikwad"
];

let present = 0;

/* GENERATE ROWS */
function loadStudents(){
    const table = document.getElementById("studentTable");
    students.forEach((name, index)=>{
        table.innerHTML += `
        <tr>
            <td>${index+1}</td>
            <td>${name}</td>
            <td id="status-${index}">Not Marked</td>
            <td><button class="mark-btn" onclick="markPresent(${index})">Present</button></td>
        </tr>`;
    });
}
loadStudents();

/* MARK PRESENT */
function markPresent(i){
    document.getElementById(`status-${i}`).innerText = "Present";
    present++;
    update();
}

/* UPDATE DASHBOARD */
function update(){
    const total = students.length;
    const absent = total - present;

    document.getElementById("present").innerText = present;
    document.getElementById("absent").innerText = absent;
    document.getElementById("percent").innerText = ((present/total)*100).toFixed(1) + "%";
}
</script>

</body>
</html>
